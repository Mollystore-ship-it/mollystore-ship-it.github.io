<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly's Sale Out</title>
    <style>
        :root { --primary-neon: #ff1493; --primary-gradient: linear-gradient(135deg, #ff1493, #ff69b4); --light-bg: #f8f9fa; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: rgba(15, 23, 42, 0.08); }
        body { font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 120px; background-color: var(--light-bg); }
        .header { text-align: center; padding: 35px 20px 25px 20px; }
        .logo-container img { max-width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 10px 25px rgba(255, 20, 147, 0.25); }
        /* Verified Badge Styling */
        .verified-badge { display: inline-flex; align-items: center; background: #e0f2fe; color: #0369a1; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 10px; border: 1px solid #bae6fd; }
        .verified-badge svg { margin-right: 5px; fill: #0284c7; }
        .headline { font-size: 28px; font-weight: 900; margin: 15px 0 6px 0; text-transform: uppercase; }
        .search-container { max-width: 570px; margin: 0 auto 20px auto; padding: 0 15px; }
        #productSearch { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); box-sizing: border-box; }
        .banner-container { max-width: 570px; margin: 0 auto 15px auto; padding: 0 15px; }
        .slider { position: relative; width: 100%; height: 140px; overflow: hidden; border-radius: 16px; border: 1px solid var(--border-color); }
        .slides { display: flex; width: 300%; height: 100%; transition: transform 0.6s ease; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 20px; box-sizing: border-box; }
        .slide-1 { background: #0f172a; } .slide-2 { background: #ff1493; } .slide-3 { background: #4338ca; }
        .scroll-indicator { text-align: center; color: var(--text-muted); font-size: 11px; margin-bottom: 15px; }
        .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 15px; max-width: 600px; margin: 0 auto; }
        .product-card { background: var(--card-bg); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid var(--border-color); }
        .product-img-wrapper { width: 100%; height: 125px; overflow: hidden; border-radius: 12px; margin-bottom: 12px; background: #f1f5f9; }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .product-title { font-size: 14px; font-weight: 700; min-height: 36px; }
        .product-price { font-weight: 800; color: var(--primary-neon); margin: 10px 0; }
        .add-btn { background: var(--primary-gradient); color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; }
