<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly's Sale Out</title>
    <style>
        :root { --primary-neon: #ff1493; --primary-gradient: linear-gradient(135deg, #ff1493, #ff69b4); --light-bg: #f8f9fa; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: rgba(15, 23, 42, 0.08); }
        body { font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 120px; background-color: var(--light-bg); }
        .header { text-align: center; padding: 35px 20px 25px 20px; }
        .logo-container img { max-width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 10px 25px rgba(255, 20, 147, 0.25); }
        .headline { font-size: 28px; font-weight: 900; margin: 15px 0 6px 0; text-transform: uppercase; }
        .verified-badge { display: inline-flex; align-items: center; background: #e0f2fe; color: #0369a1; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 10px; border: 1px solid #bae6fd; }
        .search-container { max-width: 570px; margin: 0 auto 20px auto; padding: 0 15px; }
        #productSearch { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); box-sizing: border-box; }
        .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 15px; max-width: 600px; margin: 0 auto; }
        .product-card { background: var(--card-bg); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid var(--border-color); }
        .product-img-wrapper { width: 100%; height: 125px; overflow: hidden; border-radius: 12px; margin-bottom: 12px; background: #f1f5f9; }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .product-title { font-size: 14px; font-weight: 700; min-height: 36px; }
        .product-price { font-weight: 800; color: var(--primary-neon); margin: 10px 0; }
        .add-btn { background: var(--primary-gradient); color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; padding: 10px 20px; display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; z-index: 999; border-top: 1px solid var(--border-color); }
        .checkout-btn { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-container"><img src="file_000000008b00722fb0049dbf49b4650f.png" alt="Logo"></div>
    <div class="headline">Molly's Sale Out</div>
    <div class="verified-badge">✔ VERIFIED & REGISTERED BUSINESS</div>
</div>

<div class="search-container">
    <input type="text" id="productSearch" placeholder="🔍 Search items..." onkeyup="filterProducts()">
</div>

<div class="store-grid" id="productGrid">
    <div class="product-card"><div class="product-img-wrapper"><img src="61bfee2dcbf85b286915ff64c0f77465.jpg"></div><div class="product-title">Sewing Machine Kit</div><div class="product-price">$3,500 JMD</div><button class="add-btn" onclick="addToCart('Sewing Machine Kit', 3500)">Add</button></div>
    <div class="product-card"><div class="product-img-wrapper"><img src="IMG-20260610-WA0167.jpg"></div><div class="product-title">Kids Tablet</div><div class="product-price">$8,000 JMD</div><button class="add-btn" onclick="addToCart('Kids Tablet', 8000)">Add</button></div>
    <div class="product-card"><div class="product-img-wrapper"><img src="Screenshot_20260610_191114_Temu.jpg"></div><div class="product-title">Tattoo Machine Kit</div><div class="product-price">$10,000 JMD</div><button class="add-btn" onclick="addToCart('Tattoo Machine Kit', 10000)">Add</button></div>
    <div class="product-card"><div class="product-img-wrapper"><img src="Screenshot_20260610_193730_SHEIN.jpg"></div><div class="product-title">Battery Charger</div><div class="product-price">$2,000 JMD</div><button class="add-btn" onclick="addToCart('Battery Charger', 2000)">Add</button></div>
    <div class="product-card"><div class="product-img-wrapper"><img src="Screenshot_20260610_191422_SHEIN.jpg"></div><div class="product-title">5 LED Headlamp</div><div class="product-price">$2,500 JMD</div><button class="add-btn" onclick="addToCart('5 LED Headlamp', 2500)">Add</button></div>
    <div class="product-card"><div class="product-img-wrapper"><img src="Screenshot_20260610_191753_SHEIN.jpg"></div><div class="product-title">Premium Chains</div><div class="product-price">$1,500 JMD</div><button class="add-btn" onclick="addToCart('Premium Chains', 1500)">Add</button></div>
</div>

<div class="cart-bar">
    <div style="margin-bottom: 8px; font-size: 11px;">📍 Orange Bay | 📞 876-837-8023</div>
    <button class="checkout-btn" onclick="sendWhatsAppOrder()">💬 Send Order</button>
</div>

<script>
    function filterProducts() {
        let input = document.getElementById('productSearch').value.toLowerCase();
        let cards = document.getElementsByClassName('product-card');
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].querySelector('.product-title').innerText.toLowerCase();
            cards[i].style.display = title.includes(input) ? "" : "none";
        }
    }
    function addToCart(name, price) {
        alert("Added " + name + " to cart!");
    }
    function sendWhatsAppOrder() {
        window.open("https://wa.me/18768378023", '_blank');
    }
</script>
</body>
</html>
