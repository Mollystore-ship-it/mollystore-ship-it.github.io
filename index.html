<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly's Sale Out</title>
    
    <meta property="og:title" content="Molly's Sale Out">
    <meta property="og:description" content="Check out the great deals at Molly's Sale Out!">
    <meta property="og:image" content="https://mollystore-ship-it.github.io/file_000000008b00722fb0049dbf49b4650f.png">
    <meta property="og:url" content="https://mollystore-ship-it.github.io/">
    <meta property="og:type" content="website">

    <style>
        :root {
            --primary-neon: #ff1493;
            --primary-gradient: linear-gradient(135deg, #ff1493, #ff69b4);
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(15, 23, 42, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: var(--text-main);
            padding-bottom: 95px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 35px 20px 25px 20px;
            background: radial-gradient(circle at top, rgba(255, 20, 147, 0.06), transparent 70%);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container img {
            max-width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.25);
        }

        .headline { font-size: 28px; font-weight: 900; letter-spacing: 1.5px; margin: 20px 0 6px 0; text-transform: uppercase; color: var(--text-main); }
        .subheadline { font-size: 12px; color: var(--text-muted); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

        .banner-container { max-width: 570px; margin: 15px auto; padding: 0 15px; box-sizing: border-box; }
        .slider { position: relative; width: 100%; height: 140px; overflow: hidden; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); border: 1px solid var(--border-color); }
        .slides { display: flex; width: 300%; height: 100%; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; box-sizing: border-box; }
        
        .slide-1 { background: linear-gradient(135deg, #0f172a, #1e293b); border-left: 5px solid var(--primary-neon); }
        .slide-2 { background: linear-gradient(135deg, #ff1493, #c71585); border-left: 5px solid #ffffff; }
        .slide-3 { background: linear-gradient(135deg, #4338ca, #312e81); border-left: 5px solid #38bdf8; }

        .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 15px; max-width: 600px; margin: 0 auto; }
        .product-card { background: var(--card-bg); border-radius: 16px; padding: 14px; text-align: center; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03); border: 1px solid var(--border-color); position: relative; }
        
        .stock-badge { position: absolute; top: 20px; left: 20px; background: #ffffff; color: #10b981; font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; border: 1px solid rgba(16, 185, 129, 0.15); z-index: 2; }
        .stock-badge.clearance { color: #f59e0b; border-color: rgba(245, 158, 11, 0.2); }
        
        .product-img-wrapper { width: 100%; height: 125px; overflow: hidden; border-radius: 12px; margin-bottom: 12px; background-color: #f1f5f9; }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .product-title { margin: 0 0 4px 0; font-size: 14px; color: var(--text-main); font-weight: 700; }
        .product-desc { margin: 0 0 12px 0; font-size: 11px; color: var(--text-muted); }
        .product-price { font-weight: 800; color: var(--primary-neon); margin: auto 0 12px 0; font-size: 16px; }
        
        .add-btn { background: var(--primary-gradient); color: white; border: none; padding: 11px 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto; border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid var(--border-color); z-index: 999; }
        .checkout-btn { background: #25D366; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container"><img src="file_000000008b00722fb0049dbf49b4650f.png" alt="Molly's Store"></div>
        <div class="headline">Molly's Sale Out</div>
        <div class="subheadline">Everything you need, all in one place!</div>
    </div>

    <div class="store-grid">
        <!-- Item 2: Battery Charger (Updated Filename) -->
        <div class="product-card">
            <span class="stock-badge">In Stock</span>
            <div class="product-img-wrapper"><img src="battery_charger.jpg" onerror="this.src='file_000000008b00722fb0049dbf49b4650f.png'" alt="Battery Charger"></div>
            <div class="product-title">AA/AAA Battery Charger</div>
            <div class="product-price">$2,000 JMD</div>
            <button class="add-btn" onclick="addToCart('AA/AAA Battery Charger', 2000)">Add to Cart</button>
        </div>

        <!-- Item 3: Premium Chains (Updated Filename) -->
        <div class="product-card">
            <span class="stock-badge">In Stock</span>
            <div class="product-img-wrapper"><img src="premium_chains.jpg" onerror="this.src='file_000000008b00722fb0049dbf49b4650f.png'" alt="Premium Chains"></div>
            <div class="product-title">Premium Chains</div>
            <div class="product-price">$1,500 JMD</div>
            <button class="add-btn" onclick="addToCart('Premium Chains', 1500)">Add to Cart</button>
        </div>

        <!-- Item 16: Laptop (Updated Filename) -->
        <div class="product-card">
            <span class="stock-badge clearance">Clearance</span>
            <div class="product-img-wrapper"><img src="341f40fbc9ab2deddbef09c196ad9202.jpg" onerror="this.src='file_000000008b00722fb0049dbf49b4650f.png'" alt="Laptop"></div>
            <div class="product-title">Laptop (Clearance)</div>
            <div class="product-price">$8,000 JMD</div>
            <button class="add-btn" onclick="addToCart('Laptop (Clearance Unit)', 8000)">Add to Cart</button>
        </div>
    </div>

    <div class="cart-bar">
        <div><span id="cart-count">0 items selected</span><br><b id="cart-total">$0 JMD</b></div>
        <button class="checkout-btn" onclick="sendWhatsAppOrder()">💬 Send Text Order</button>
    </div>

    <script>
        let cart = {};
        function addToCart(name, price) {
            cart[name] = { price: price, qty: (cart[name] ? cart[name].qty + 1 : 1) };
            updateCartUI();
        }
        function updateCartUI() {
            let totalItems = 0, totalPrice = 0;
            for (let key in cart) { totalItems += cart[key].qty; totalPrice += (cart[key].price * cart[key].qty); }
            document.getElementById('cart-count').innerText = totalItems + ' items selected';
            document.getElementById('cart-total').innerText = '$' + totalPrice.toLocaleString() + ' JMD';
        }
        function sendWhatsAppOrder() {
            let orderList = "";
            for (let key in cart) orderList += `${cart[key].qty}x ${key}\n`;
            window.open(`https://wa.me/18768378023?text=${encodeURIComponent('Hi! I want to order:\n' + orderList)}`, '_blank');
        }
    </script>
</body>
</html>
